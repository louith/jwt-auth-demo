<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; padding: 0 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="greeting">Loading...</h1>
  <p id="details"></p>
  <button id="logout">Log out</button>

  <script>
    let accessToken = localStorage.getItem("accessToken");
    let refreshToken = localStorage.getItem("refreshToken");

    function goToLogin() {
      localStorage.removeItem("accessToken");
      localStorage.removeItem("refreshToken");
      window.location.href = "/index.html";
    }

    // Single-flight: parallel 401s share one refresh call, so the server
    // doesn't see the same refresh token twice and flag it as reuse.
    let refreshing = null;
    function refreshTokens() {
      if (!refreshing) {
        refreshing = (async () => {
          const res = await fetch("/api/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refreshToken }),
          });
          if (!res.ok) throw new Error("Refresh failed");

          const data = await res.json();
          accessToken = data.accessToken;
          refreshToken = data.refreshToken; // rotated: the old one is now dead
          localStorage.setItem("accessToken", accessToken);
          localStorage.setItem("refreshToken", refreshToken);
        })().finally(() => { refreshing = null; });
      }
      return refreshing;
    }

    // Use this instead of fetch() for any protected endpoint
    async function authFetch(url, options = {}) {
      const send = () =>
        fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` },
        });

      const res = await send();
      if (res.status !== 401) return res;

      try {
        await refreshTokens();
      } catch {
        goToLogin(); // refresh token expired, revoked, or reused
        return res;
      }
      return send(); // retry once with the new access token
    }

    async function loadProfile() {
      const res = await authFetch("/api/users/me");
      if (!res.ok) return goToLogin();

      const user = await res.json();
      document.getElementById("greeting").textContent = `Hello, ${user.name}`;
      document.getElementById("details").textContent = `Signed in as ${user.email}`;
    }

    document.getElementById("logout").addEventListener("click", async () => {
      // Revoke server-side so the refresh token is dead, not just forgotten
      await fetch("/api/auth/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refreshToken }),
      }).catch(() => {});
      goToLogin();
    });

    if (!refreshToken) goToLogin();
    else loadProfile();
  </script>
</body>
</html>
