<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 3rem auto; padding: 0 1rem; }
    h2 { margin-top: 2rem; }
    input, button { display: block; width: 100%; padding: .6rem; margin-bottom: .6rem; box-sizing: border-box; font-size: 1rem; }
    button { cursor: pointer; }
    #message { min-height: 1.5rem; color: #b00020; }
    #message.ok { color: #1b7f3b; }
  </style>
</head>
<body>
  <p id="message"></p>

  <h2>Log in</h2>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button type="submit">Log in</button>
  </form>

  <h2>Create account</h2>
  <form id="register-form">
    <input type="text" id="reg-name" placeholder="Name" required />
    <input type="email" id="reg-email" placeholder="Email" required />
    <input type="password" id="reg-password" placeholder="Password (min 8 characters)" required />
    <button type="submit">Create account</button>
  </form>

  <script>
    const message = document.getElementById("message");

    function show(text, ok = false) {
      message.textContent = text;
      message.className = ok ? "ok" : "";
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      return { ok: res.ok, data: await res.json() };
    }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/api/auth/register", {
        name: document.getElementById("reg-name").value,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value,
      });
      show(ok ? data.message : data.error, ok);
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/api/auth/login", {
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value,
      });
      if (!ok) return show(data.error);

      // keep BOTH tokens now
      localStorage.setItem("accessToken", data.accessToken);
      localStorage.setItem("refreshToken", data.refreshToken);
      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
